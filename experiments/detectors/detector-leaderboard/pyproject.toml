[project]
name = "detector-leaderboard"
version = "0.1.0"
description = "Frame-level object-detection evaluation and leaderboard for smoke detectors"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.0",
    "huggingface-hub>=0.24",
    "matplotlib>=3.8",
    "numpy>=1.26,<2",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "sahi>=0.11",
    "tqdm>=4.66",
    "wandb>=0.18",
    "transformers>=4.52",
    "ultralytics>=8.3",
]

[dependency-groups]
dev = [
    "dvc[s3]>=3.56",
    "nbqa>=1.9",
    "nbstripout>=0.8",
    "pytest>=8.0",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/detector_leaderboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
# External repos cloned into the tree (isolated venvs) are not ours to lint.
extend-exclude = ["deimv2_repo", ".rfdetr-venv", ".deimv2-venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "PLC0415"]

[tool.ruff.format]
quote-style = "double"
