__include__: ['./deimv2_s_smoke.yml']

# DEIMv2-S trained at 1024px (to compare like-for-like with the 1024 models).
# Inherits data paths / num_classes=2 / remap=False from deimv2_s_smoke.yml; only
# the resolution-dependent knobs are scaled up (640 -> 1024, i.e. x1.6). batch is
# halved (16 -> 8) since 1024 is ~2.5x the pixels of 640.
output_dir: ./outputs/deimv2_s_smoke_1024

eval_spatial_size: [1024, 1024]

train_dataloader:
  total_batch_size: 8
  dataset:
    transforms:
      ops:
        - {type: Mosaic, output_size: 512, rotation_range: 10, translation_range: [0.1, 0.1], scaling_range: [0.5, 1.5],
           probability: 1.0, fill_value: 0, use_cache: True, max_cached_images: 50, random_pop: True}
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [1024, 1024], }
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
  collate_fn:
    base_size: 1024

val_dataloader:
  total_batch_size: 8
  dataset:
    transforms:
      ops:
        - {type: Resize, size: [1024, 1024], }
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
